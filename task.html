<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切片任务详情</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/maplibre-gl/4.5.0/maplibre-gl.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            color: rgba(0,0,0,0.85);
        }
        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }
        .page-header {
            background: #fff;
            padding: 20px 24px;
            margin-bottom: 16px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header h1 {
            font-size: 20px;
            font-weight: 500;
        }
        .btn {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #d9d9d9;
            background: #fff;
            color: rgba(0,0,0,0.85);
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn:hover {
            color: #1890ff;
            border-color: #1890ff;
        }
        .btn-primary {
            background: #1890ff;
            color: #fff;
            border-color: #1890ff;
        }
        .btn-primary:hover {
            background: #40a9ff;
            border-color: #40a9ff;
            color: #fff;
        }
        .main-content {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px;
        }
        .info-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .info-card h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .stat-item:last-child { border-bottom: none; }
        .stat-label {
            color: rgba(0,0,0,0.45);
            font-size: 14px;
        }
        .stat-value {
            font-weight: 500;
            font-size: 14px;
        }
        .village-selector {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }
        .village-selector label {
            display: block;
            color: rgba(0,0,0,0.45);
            font-size: 14px;
            margin-bottom: 8px;
        }
        .village-selector select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
        }
        .village-selector select:focus {
            outline: none;
            border-color: #1890ff;
        }
        .map-card {
            background: #fff;
            border-radius: 8px;
            padding: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .map-header {
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .map-container {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 500px;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: rgba(0,0,0,0.45);
        }
        .not-found {
            text-align: center;
            padding: 80px 20px;
        }
        .not-found h2 {
            font-size: 24px;
            margin-bottom: 16px;
        }
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .map-container {
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="app-content">
            <div class="page-header">
                <h1 id="task-title">加载中...</h1>
                <a href="/" class="btn">返回任务列表</a>
            </div>
            <div class="loading">正在加载任务详情...</div>
        </div>
    </div>

    <!-- 本地资源加载（无需外部CDN）-->
    <script src="/lib/react.min.js"></script>
    <script src="/lib/react-dom.min.js"></script>

    <script>
        // 检查React是否加载成功
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
            document.getElementById('app-content').innerHTML =
                '<div class="not-found"><h2>资源加载失败</h2><p>React未能加载,请联系管理员检查 <code>/lib/</code> 目录</p><br><a href="/" class="btn">返回</a></div>';
            throw new Error('React not loaded');
        }

        const { useState, useEffect, useRef } = React;

        // 获取URL参数
        const getUrlParameter = (name) => {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        };

        // 模拟任务详情数据
        const getTaskDetail = (taskId) => {
            if (taskId === 'tumote_left_20250814') {
                return {
                    id: 'tumote_left_20250814',
                    name: '土默特左旗无人机切片任务',
                    province: '内蒙古自治区',
                    city: '呼和浩特市',
                    county: '土默特左旗',
                    taskTime: '2025-08-14',
                    villageCount: 34,
                    totalArea: 1850,
                    center: [111.4, 40.6],
                    boundaryPmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/bianjie.pmtiles',
                    villages: [
                        { id: 'san_liang_cun', name: '三两村', pmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/san_liang_cun.pmtiles' },
                        { id: 'bai_miao_zi_cun', name: '白庙子村', pmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/bai_miao_zi_cun.pmtiles' },
                        { id: 'xiao_tu_li_cun', name: '小图利村', pmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/xiao_tu_li_cun.pmtiles' },
                        { id: 'zhao_jia_yao_cun', name: '赵家窑村', pmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/zhao_jia_yao_cun.pmtiles' },
                        { id: 'da_qing_shan_cun', name: '大青山村', pmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/da_qing_shan_cun.pmtiles' }
                    ]
                };
            }
            if (taskId === 'zhaohu_lian_20250528') {
                return {
                    id: 'zhaohu_lian_20250528',
                    name: '皂户李镇皂户李联村切片任务',
                    province: '山东省',
                    city: '滨州市',
                    county: '惠民县',
                    town: '皂户李镇',
                    taskTime: '2025-05-28',
                    villageCount: 1,
                    totalArea: 18.34,
                    center: [117.6, 37.5],
                    boundaryPmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/bianjie.pmtiles',
                    villages: [
                        { id: 'zhaohu_lian_cun', name: '皂户李联村', pmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/zhaohu_lian_cun.pmtiles' }
                    ]
                };
            }
            if (taskId === 'yanshichi_20250528') {
                return {
                    id: 'yanshichi_20250528',
                    name: '砚池山村切片任务',
                    province: '云南省',
                    city: '昭通市',
                    county: '鲁甸县',
                    town: '文屏镇',
                    taskTime: '2025-05-28',
                    villageCount: 2,
                    totalArea: 12.5,
                    center: [103.5, 27.2],
                    boundaryPmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/bianjie.pmtiles',
                    villages: [
                        { id: 'yanchi_shan_cun', name: '砚池山村', pmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/yanchi_shan_cun.pmtiles' },
                        { id: 'yang_guang_she_qu', name: '阳光社区', pmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/yang_guang_she_qu.pmtiles' }
                    ]
                };
            }
            // 默认任务
            return {
                id: taskId,
                name: `任务 ${taskId}`,
                province: '示例省',
                city: '示例市',
                county: '示例县',
                taskTime: '2025-05-28',
                villageCount: 1,
                totalArea: 10,
                center: [111.4, 40.6],
                boundaryPmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/bianjie.pmtiles',
                villages: [
                    { id: 'default_village', name: '示例村庄', pmtilesUrl: 'https://flash-map-web.oss-cn-beijing.aliyuncs.com/tumote_left_5.pmtiles' }
                ]
            };
        };

        function TaskDetail() {
            const taskId = getUrlParameter('id');
            const [taskData, setTaskData] = useState(null);
            const [selectedVillage, setSelectedVillage] = useState('');
            const [mapLibreLoaded, setMapLibreLoaded] = useState(false);
            const mapContainerRef = useRef(null);
            const mapRef = useRef(null);

            useEffect(() => {
                if (!taskId) {
                    setTaskData(null);
                    return;
                }
                const data = getTaskDetail(taskId);
                setTaskData(data);
                if (data.villages.length > 0) {
                    setSelectedVillage(data.villages[0].id);
                }
            }, [taskId]);

            // 加载MapLibre GL和PMTiles
            useEffect(() => {
                if (typeof maplibregl !== 'undefined') {
                    setMapLibreLoaded(true);
                    return;
                }
                // 尝试加载本地lib中的maplibre-gl
                const script = document.createElement('script');
                script.src = '/lib/maplibre-gl.js';
                script.onload = () => setMapLibreLoaded(true);
                script.onerror = () => {
                    console.warn('本地maplibre-gl加载失败,使用基础地图视图');
                    setMapLibreLoaded(false);
                };
                document.head.appendChild(script);
            }, []);

            // 初始化地图
            useEffect(() => {
                if (!taskData || !mapLibreLoaded || !mapContainerRef.current) return;

                if (mapRef.current) {
                    mapRef.current.remove();
                    mapRef.current = null;
                }

                try {
                    const map = new maplibregl.Map({
                        container: mapContainerRef.current,
                        style: {
                            version: 8,
                            sources: {
                                'base-map': {
                                    type: 'raster',
                                    tiles: [
                                        'https://t1.tianditu.gov.cn/DataServer?T=img_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t2.tianditu.gov.cn/DataServer?T=img_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t3.tianditu.gov.cn/DataServer?T=img_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t4.tianditu.gov.cn/DataServer?T=img_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t5.tianditu.gov.cn/DataServer?T=img_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t6.tianditu.gov.cn/DataServer?T=img_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t7.tianditu.gov.cn/DataServer?T=img_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360'
                                    ],
                                    tileSize: 256,
                                    attribution: '天地图'
                                },
                                'annotation': {
                                    type: 'raster',
                                    tiles: [
                                        'https://t1.tianditu.gov.cn/DataServer?T=cva_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t2.tianditu.gov.cn/DataServer?T=cva_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t3.tianditu.gov.cn/DataServer?T=cva_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t4.tianditu.gov.cn/DataServer?T=cva_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t5.tianditu.gov.cn/DataServer?T=cva_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t6.tianditu.gov.cn/DataServer?T=cva_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360',
                                        'https://t7.tianditu.gov.cn/DataServer?T=cva_w&X={x}&Y={y}&L={z}&tk=b88bfb160c81dab8d9d20aaa74846360'
                                    ],
                                    tileSize: 256
                                }
                            },
                            layers: [
                                {
                                    id: 'base-map-layer',
                                    type: 'raster',
                                    source: 'base-map',
                                    paint: { 'raster-opacity': 1.0 }
                                },
                                {
                                    id: 'annotation-layer',
                                    type: 'raster',
                                    source: 'annotation',
                                    minzoom: 0,
                                    maxzoom: 22,
                                    paint: { 'raster-opacity': 1.0 }
                                }
                            ]
                        },
                        center: taskData.center,
                        zoom: 10
                    });

                    map.addControl(new maplibregl.NavigationControl(), 'top-right');

                    map.on('load', () => {
                        console.log('地图加载完成');
                        console.log('村界:', taskData.boundaryPmtilesUrl);
                        const village = taskData.villages.find(v => v.id === selectedVillage);
                        if (village) {
                            console.log('当前村庄影像:', village.pmtilesUrl);
                        }
                    });

                    mapRef.current = map;
                } catch (err) {
                    console.error('地图初始化失败:', err);
                }

                return () => {
                    if (mapRef.current) {
                        mapRef.current.remove();
                        mapRef.current = null;
                    }
                };
            }, [taskData, mapLibreLoaded]);

            if (!taskId) {
                return React.createElement('div', { className: 'not-found' },
                    React.createElement('h2', null, '任务ID缺失'),
                    React.createElement('p', null, '请通过任务列表访问详情'),
                    React.createElement('br'),
                    React.createElement('a', { href: '/', className: 'btn btn-primary' }, '返回任务列表')
                );
            }

            if (!taskData) {
                return React.createElement('div', { className: 'loading' }, '加载任务数据...');
            }

            const region = `${taskData.province} / ${taskData.city} / ${taskData.county}${taskData.town ? ' / ' + taskData.town : ''}`;

            return React.createElement(React.Fragment, null,
                React.createElement('div', { className: 'page-header' },
                    React.createElement('h1', null, taskData.name),
                    React.createElement('a', { href: '/', className: 'btn' }, '返回任务列表')
                ),
                React.createElement('div', { className: 'main-content' },
                    React.createElement('div', { className: 'info-card' },
                        React.createElement('h3', null, '任务信息'),
                        React.createElement('div', { className: 'stat-item' },
                            React.createElement('span', { className: 'stat-label' }, '任务ID'),
                            React.createElement('span', { className: 'stat-value', style: { fontSize: '12px', fontFamily: 'monospace' } }, taskData.id)
                        ),
                        React.createElement('div', { className: 'stat-item' },
                            React.createElement('span', { className: 'stat-label' }, '行政区划'),
                            React.createElement('span', { className: 'stat-value' }, region)
                        ),
                        React.createElement('div', { className: 'stat-item' },
                            React.createElement('span', { className: 'stat-label' }, '任务时间'),
                            React.createElement('span', { className: 'stat-value' }, taskData.taskTime)
                        ),
                        React.createElement('div', { className: 'stat-item' },
                            React.createElement('span', { className: 'stat-label' }, '村庄数量'),
                            React.createElement('span', { className: 'stat-value' }, taskData.villageCount + ' 个')
                        ),
                        React.createElement('div', { className: 'stat-item' },
                            React.createElement('span', { className: 'stat-label' }, '覆盖面积'),
                            React.createElement('span', { className: 'stat-value' }, taskData.totalArea + ' km²')
                        ),
                        React.createElement('div', { className: 'village-selector' },
                            React.createElement('label', null, '选择村庄查看影像'),
                            React.createElement('select', {
                                value: selectedVillage,
                                onChange: (e) => setSelectedVillage(e.target.value)
                            },
                                taskData.villages.map(village =>
                                    React.createElement('option', { key: village.id, value: village.id }, village.name)
                                )
                            )
                        )
                    ),
                    React.createElement('div', { className: 'map-card' },
                        React.createElement('div', { className: 'map-header' },
                            React.createElement('span', null, '任务地图'),
                            selectedVillage && taskData.villages.find(v => v.id === selectedVillage)
                                ? React.createElement('span', { style: { fontSize: '14px', color: 'rgba(0,0,0,0.45)' } },
                                    '当前: ',
                                    taskData.villages.find(v => v.id === selectedVillage).name)
                                : null
                        ),
                        React.createElement('div', { ref: mapContainerRef, className: 'map-container' },
                            !mapLibreLoaded
                                ? React.createElement('div', { className: 'loading' }, '地图引擎加载中...')
                                : null
                        )
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app-content'));
        root.render(React.createElement(TaskDetail));
    </script>
</body>
</html>
