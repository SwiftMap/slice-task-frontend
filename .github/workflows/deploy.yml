name: Deploy to server

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-task-master
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmmirror.com'  # 国内镜像，避免网络问题

      - name: Install dependencies
        run: |
          echo "Using npmmirror registry for faster install in China"
          npm config set registry https://registry.npmmirror.com
          npm install --no-audit --no-fund
        env:
          # 兜底：使用国内镜像（包括可能用到的子依赖）
          npm_config_strict_ssl: 'false'

      - name: Build with Vite
        run: |
          echo "Building production bundle..."
          npm run build
          echo "Build output:"
          ls -la dist/

      - name: Verify build output
        run: |
          echo "Verifying build artifacts..."
          if [ ! -d "dist/assets" ]; then
            echo "ERROR: dist/assets not found"
            exit 1
          fi
          echo "Built files:"
          ls -la dist/
          echo "--- Assets ---"
          ls -la dist/assets/ | head -20

      - name: Prepare SSH
        env:
          SERVER_HOST: 'map.flashmap.cn'
          SERVER_PORT: '22'
          SERVER_USER: 'root'
          TARGET_DIR: '/var/www/html/task'
        run: |
          set -e
          mkdir -p ~/.ssh
          PORT="$SERVER_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh-keyscan -p "$PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "Using SSH_PRIVATE_KEY"
            eval "$(ssh-agent -s)"
            KEYFILE=$(mktemp)
            echo "$SSH_PRIVATE_KEY" > "$KEYFILE"
            chmod 600 "$KEYFILE"
            ssh-add "$KEYFILE"
            rm -f "$KEYFILE"
          elif [ -n "$SSH_PASSWORD" ]; then
            echo "Installing sshpass for password-based deploy"
            sudo apt-get update && sudo apt-get install -y sshpass
          else
            echo "No SSH_PRIVATE_KEY or SSH_PASSWORD provided"
            exit 1
          fi

      - name: Upload dist via scp
        env:
          SERVER_HOST: 'map.flashmap.cn'
          SERVER_USER: 'root'
          SERVER_PORT: '22'
          TARGET_DIR: '/var/www/html/task'
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          PORT="$SERVER_PORT"
          set -e
          # 打包整个 dist 目录
          tar -czf slice-task.tar.gz -C dist .
          echo "Uploading slice-task.tar.gz to ${SERVER_USER}@${SERVER_HOST}:${TARGET_DIR}"
          if ssh-add -l >/dev/null 2>&1; then
            scp -P "$PORT" slice-task.tar.gz "${SERVER_USER}@${SERVER_HOST}:${TARGET_DIR}/slice-task.tar.gz"
          else
            sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P "$PORT" slice-task.tar.gz "${SERVER_USER}@${SERVER_HOST}:${TARGET_DIR}/slice-task.tar.gz"
          fi

      - name: Extract on remote server
        env:
          SERVER_HOST: 'map.flashmap.cn'
          SERVER_USER: 'root'
          SERVER_PORT: '22'
          TARGET_DIR: '/var/www/html/task'
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          PORT="$SERVER_PORT"
          echo "Extracting slice-task.tar.gz into ${TARGET_DIR}"
          if ssh-add -l >/dev/null 2>&1; then
            ssh -p "$PORT" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${TARGET_DIR}' && tar -xzf '${TARGET_DIR}/slice-task.tar.gz' -C '${TARGET_DIR}' && rm -f '${TARGET_DIR}/slice-task.tar.gz' && echo 'Deployment complete' && ls -la '${TARGET_DIR}'"
          else
            sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$PORT" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${TARGET_DIR}' && tar -xzf '${TARGET_DIR}/slice-task.tar.gz' -C '${TARGET_DIR}' && rm -f '${TARGET_DIR}/slice-task.tar.gz' && echo 'Deployment complete' && ls -la '${TARGET_DIR}'"
          fi

      - name: Verify deployment
        run: |
          echo "Deployment verification:"
          echo "Access URLs:"
          echo "  - https://task.flashmap.cn/"
          echo "  - https://task.flashmap.cn/task.html?id=tumote_left_20250814"